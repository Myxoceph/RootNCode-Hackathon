services:
  postgres:
    image: postgres:16-alpine
    container_name: vagabonds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vagabonds
      POSTGRES_PASSWORD: vagabonds
      POSTGRES_DB: vagabonds
    # Only this computer: the password is in git, and on shared Wi-Fi (the venue) anyone could connect.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagabonds -d vagabonds"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
