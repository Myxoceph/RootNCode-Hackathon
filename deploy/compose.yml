# Demo server stack (see docs/deploy.md). Run from the repository root:
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#
# postgres ← seed (migrations + data import, runs once per `up`) ← api ← web (Caddy: HTTPS, web app, /api)
# Only Caddy publishes ports; PostgreSQL and the API are reachable only inside the compose network.
name: vagabonds

x-database-url: &database-url postgresql://vagabonds:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/vagabonds

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vagabonds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: vagabonds
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagabonds -d vagabonds"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: seed
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      NODE_ENV: production
      LOG_LEVEL: info
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-https://media.allbytech.com}
      ASSET_VISIBILITY: published
      # Only Caddy reaches the API (private Docker network); the rate limit keys on the client IP it forwards.
      TRUST_PROXY: uniquelocal
      # AI assistant; empty turns it off. Ollama on the same machine: http://host.docker.internal:11434/v1
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
    # Lets the container reach a model served on the host (Docker Desktop has it already; Linux needs this).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
