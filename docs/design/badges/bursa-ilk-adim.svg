<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- Bursa'ya Merhaba: Ulu Cami's domes and two minarets before a snowy Uludağ at dusk,
       in the glass-medal style of docs/design/achievement-badges.png. -->
  <defs>
    <clipPath id="face"><circle cx="320" cy="320" r="292"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1634"/>
      <stop offset="0.35" stop-color="#22285A"/>
      <stop offset="0.55" stop-color="#6B3F66"/>
      <stop offset="0.7" stop-color="#D9774E"/>
      <stop offset="0.8" stop-color="#F7AE63"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE6B0" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FBB466" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F7A75C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B5C8E"/>
      <stop offset="1" stop-color="#3A3A66"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D3EE"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E6E58"/>
      <stop offset="0.55" stop-color="#E7C08C"/>
      <stop offset="1" stop-color="#F3D29E"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9C6E2"/>
      <stop offset="0.6" stop-color="#7D8CB2"/>
      <stop offset="1" stop-color="#55628A"/>
    </linearGradient>
    <linearGradient id="minaret" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A88466"/>
      <stop offset="0.5" stop-color="#F2D3A2"/>
      <stop offset="1" stop-color="#C79C70"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24295A"/>
      <stop offset="1" stop-color="#0E1532"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4EC7A"/>
      <stop offset="0.5" stop-color="#9DC24A"/>
      <stop offset="1" stop-color="#4E8A2E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DB4FF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#3A4E8C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9DB4FF" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#0B172D" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#0B172D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0B172D" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Rim: the dark navy of the sheet, under the glass ring -->
  <circle cx="320" cy="320" r="316" fill="#0B172D"/>

  <g clip-path="url(#face)">
    <rect width="640" height="640" fill="url(#sky)"/>
    <!-- a few stars high up -->
    <g fill="#FFFFFF">
      <circle cx="150" cy="150" r="2.2" opacity="0.8"/>
      <circle cx="210" cy="110" r="1.6" opacity="0.6"/>
      <circle cx="440" cy="135" r="2" opacity="0.7"/>
      <circle cx="505" cy="190" r="1.5" opacity="0.55"/>
      <circle cx="110" cy="230" r="1.4" opacity="0.5"/>
      <circle cx="385" cy="95" r="1.3" opacity="0.5"/>
    </g>
    <!-- setting sun behind the mountain -->
    <circle cx="330" cy="380" r="210" fill="url(#sun)"/>

    <!-- Uludağ -->
    <path d="M0 430 L110 350 L170 372 L270 268 L330 300 L390 250 L470 318 L540 292 L640 360 L640 640 L0 640 Z" fill="url(#mountain)"/>
    <path d="M270 268 L292 290 L282 296 L298 300 L312 290 L330 300 L300 272 Z" fill="url(#snow)" opacity="0.9"/>
    <path d="M390 250 L414 274 L404 282 L424 284 L436 296 L452 304 L420 272 Z" fill="url(#snow)" opacity="0.9"/>
    <path d="M0 470 L120 410 L210 440 L330 388 L470 430 L640 405 L640 640 L0 640 Z" fill="#2B2E58" opacity="0.9"/>

    <!-- Ulu Cami: the body, its domes in two rows and the two minarets -->
    <g transform="translate(362 504) scale(1.12) translate(-331 -504)">
      <!-- west minaret -->
      <rect x="164" y="248" width="20" height="230" fill="url(#minaret)"/>
      <rect x="158" y="300" width="32" height="9" rx="2" fill="#C49A6E"/>
      <path d="M164 248 L174 196 L184 248 Z" fill="url(#dome)"/>
      <rect x="172" y="186" width="4" height="12" fill="#E7C08C"/>
      <!-- east minaret -->
      <rect x="456" y="262" width="20" height="216" fill="url(#minaret)"/>
      <rect x="450" y="312" width="32" height="9" rx="2" fill="#C49A6E"/>
      <path d="M456 262 L466 210 L476 262 Z" fill="url(#dome)"/>
      <rect x="464" y="200" width="4" height="12" fill="#E7C08C"/>

      <!-- back row of domes -->
      <g fill="url(#dome)">
        <path d="M212 402 a28 28 0 0 1 56 0 Z"/>
        <path d="M272 398 a34 34 0 0 1 68 0 Z"/>
        <path d="M344 398 a34 34 0 0 1 68 0 Z"/>
        <path d="M414 402 a26 26 0 0 1 52 0 Z"/>
      </g>
      <!-- body -->
      <rect x="190" y="408" width="282" height="96" fill="url(#wall)"/>
      <rect x="190" y="400" width="282" height="12" fill="#C79C70"/>
      <!-- front row of domes -->
      <g fill="url(#dome)">
        <path d="M196 408 a22 22 0 0 1 44 0 Z"/>
        <path d="M244 408 a22 22 0 0 1 44 0 Z"/>
        <path d="M292 408 a22 22 0 0 1 44 0 Z"/>
        <path d="M340 408 a22 22 0 0 1 44 0 Z"/>
        <path d="M388 408 a22 22 0 0 1 44 0 Z"/>
        <path d="M430 408 a20 20 0 0 1 40 0 Z"/>
      </g>
      <g fill="#E7C08C">
        <rect x="216" y="380" width="3" height="8"/><rect x="264" y="380" width="3" height="8"/>
        <rect x="312" y="380" width="3" height="8"/><rect x="360" y="380" width="3" height="8"/>
        <rect x="408" y="380" width="3" height="8"/><rect x="449" y="382" width="3" height="8"/>
      </g>
      <!-- arched windows, warm-lit -->
      <g fill="#4A3424">
        <path d="M210 470 v-26 a9 9 0 0 1 18 0 v26 Z"/>
        <path d="M250 470 v-26 a9 9 0 0 1 18 0 v26 Z"/>
        <path d="M394 470 v-26 a9 9 0 0 1 18 0 v26 Z"/>
        <path d="M434 470 v-26 a9 9 0 0 1 18 0 v26 Z"/>
      </g>
      <!-- the portal -->
      <rect x="300" y="430" width="62" height="74" fill="#D4A874"/>
      <path d="M312 504 v-44 a19 19 0 0 1 38 0 v44 Z" fill="#3A2718"/>
      <path d="M318 504 v-40 a13 13 0 0 1 26 0 v40 Z" fill="#FFC979" opacity="0.55"/>
    </g>

    <!-- foreground hill -->
    <path d="M0 500 C120 470 230 500 330 496 C450 492 540 470 640 488 L640 640 L0 640 Z" fill="url(#ground)"/>

    <!-- the sprout of the "Merhaba" badges -->
    <g transform="translate(112 560) scale(1.08) translate(-128 -560)">
      <path d="M128 560 C126 500 132 440 142 380" stroke="#7FA83A" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M142 380 C112 350 112 310 140 282 C166 312 168 352 142 380 Z" fill="url(#leaf)"/>
      <path d="M134 462 C96 456 70 430 66 398 C104 398 130 424 134 462 Z" fill="url(#leaf)"/>
      <path d="M137 426 C172 412 196 384 198 352 C164 356 140 384 137 426 Z" fill="url(#leaf)"/>
      <path d="M130 512 C168 506 194 484 202 456 C168 456 140 478 130 512 Z" fill="url(#leaf)" opacity="0.95"/>
      <path d="M142 282 C146 320 145 350 142 380" stroke="#5E8A2B" stroke-width="2" fill="none" opacity="0.6"/>
    </g>

    <rect width="640" height="640" fill="url(#vignette)"/>
    <rect width="640" height="640" fill="url(#sheen)"/>
  </g>

  <!-- glass ring -->
  <circle cx="320" cy="320" r="296" fill="none" stroke="url(#glass)" stroke-width="10"/>
  <circle cx="320" cy="320" r="304" fill="none" stroke="#C9D7FF" stroke-opacity="0.25" stroke-width="2"/>
  <!-- the orange glow on the right edge -->
  <path d="M520 106 A296 296 0 0 1 600 420" fill="none" stroke="#FFA43C" stroke-width="20" stroke-linecap="round" filter="url(#glow)" opacity="0.85"/>
  <path d="M520 106 A296 296 0 0 1 600 420" fill="none" stroke="#FFD08A" stroke-width="6" stroke-linecap="round" filter="url(#soft)"/>
  <!-- the sparkle at the top -->
  <path d="M320 44 C323 62 328 67 346 70 C328 73 323 78 320 96 C317 78 312 73 294 70 C312 67 317 62 320 44 Z" fill="#FFFFFF"/>
  <circle cx="320" cy="70" r="12" fill="#FFFFFF" opacity="0.25" filter="url(#soft)"/>
</svg>
