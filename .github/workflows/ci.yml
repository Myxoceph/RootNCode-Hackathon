name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, contract & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vagabonds
          POSTGRES_PASSWORD: vagabonds
          POSTGRES_DB: vagabonds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vagabonds -d vagabonds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database, not a secret.
      DATABASE_URL: postgresql://vagabonds:vagabonds@localhost:5432/vagabonds
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python (data tools)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install dependencies (also generates the Prisma client)
        run: |
          npm ci
          python -m pip install -r data/requirements.txt

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint the app (rules of hooks)
        run: npm run lint --workspace @vagabonds/app

      - name: Validate the dataset (JSON Schema + cross-checks)
        run: python data/tools/validate.py

      - name: Validate the mock data contract
        run: npm run contracts:validate

      - name: Check design token contrast (WCAG 2.1 AA)
        run: npm run ui:contrast

      - name: Validate the Prisma schema
        run: npm run prisma:validate --workspace @vagabonds/api

      - name: Apply database migrations
        run: npm run db:deploy --workspace @vagabonds/api

      - name: Import the dataset and verify the schema mapping
        # Proves the Prisma-managed schema matches data/tools/db_rows.py (columns and rows).
        run: python data/tools/import_to_db.py --verify

      - name: Test the data pipeline (Veri Döngüsü worker, local-only guard, EVREN client)
        # The worker's tests make a schema of their own, apply the intake migration there and drop it.
        run: python -m unittest discover -s data/pipeline/tests

      - name: Run tests (unit + integration against PostgreSQL)
        run: npm test
